name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/api/**'
      - 'apps/bot/**'
      - 'data/company-knowledge/**'
      - 'deploy/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'templates/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/bot/**'
      - '.github/workflows/deploy-api.yml'

concurrency:
  # One deploy at a time — the VPS has a single vCPU and cannot survive two
  # concurrent `uv sync` / `bun install` runs.
  group: deploy-api-${{ github.ref }}
  # PR runs are superseded by the next push; prod deploys always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `src` defaults to the whole workspace, so it must be set: passing the
      # path in `args` alone still lints every other Python file in the repo.
      # The version is pinned to the one in apps/api so CI and local agree.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.10"
          src: apps/api
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.10"
          src: apps/api/tests
          args: format --check

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    # A hung test used to burn the runner for hours; this caps it instead.
    timeout-minutes: 15

    # Postgres is here only for the migration steps: they are what production
    # actually runs, and they finish in seconds. The suite itself runs on
    # SQLite, which is minutes faster and is what the fixtures are built for.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bnb
          POSTGRES_PASSWORD: bnb
          POSTGRES_DB: motherboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bnb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID || 'mock_client_id' }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET || 'mock_client_secret' }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || 'mock_bot_token' }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID || 'mock_guild_id' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'mock_session_secret_32_bytes_long_secret_123' }}
      API_INTERNAL_SECRET: ${{ secrets.API_INTERNAL_SECRET || 'mock_internal_secret' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'mock_nextauth_secret' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --project apps/api --frozen --python 3.12

      - name: Check migrations build, match the models, and roll back
        working-directory: apps/api
        # `check` fails when app/db/models.py has changes no migration accounts
        # for; without it, deploy.sh papered over the gap with create_all and
        # the drift surfaced as a 500 in production. The downgrade matters
        # because deploy.sh rolls back to the previous revision on failure.
        env:
          DATABASE_URL: postgresql+asyncpg://bnb:bnb@localhost:5432/motherboard_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run backend tests
        working-directory: apps/api
        run: uv run pytest -n auto -p no:sugar

  bot-test:
    name: Discord bot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run bot tests
        run: bun test --cwd apps/bot

  deploy:
    name: Deploy to VPS
    needs: [lint, test, bot-test]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            echo "Starting deployment on VPS..."
            # Guard the checkout before fetching or executing deployment code.
            dirty_paths=$(git -C /opt/bnb-api status --porcelain=v1 --untracked-files=normal) || {
              echo "Deployment stopped: could not inspect /opt/bnb-api."
              exit 1
            }
            if [ -n "$dirty_paths" ]; then
              echo "Deployment stopped: /opt/bnb-api has local changes. Preserve or reconcile them first."
              printf '%s\n' "$dirty_paths" | head -30
              exit 1
            fi
            # Execute an immutable copy from the revision being deployed. Running
            # the checkout's script while it resets that same checkout can leave
            # Bash reading a mixture of the old and new file.
            target_commit='${{ github.sha }}'
            git -C /opt/bnb-api fetch origin "$target_commit"
            deploy_script=$(mktemp)
            trap 'rm -f "$deploy_script"' EXIT
            git -C /opt/bnb-api show "$target_commit:deploy/api/deploy.sh" > "$deploy_script"
            bash "$deploy_script" "$target_commit"
