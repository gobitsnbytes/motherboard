name: CI/CD Pipeline

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/api/**'
      - 'apps/bot/**'
      - 'data/company-knowledge/**'
      - 'deploy/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'templates/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'

concurrency:
  # One deploy at a time — the VPS has a single vCPU and cannot survive two
  # concurrent `uv sync` / `bun install` runs.
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `src` defaults to the whole workspace, so it must be set: passing the
      # path in `args` alone still lints every other Python file in the repo.
      # The version is pinned to the one in apps/api so CI and local agree.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.10"
          src: apps/api
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.10"
          src: apps/api/tests
          args: format --check

  test:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest

    # Production runs Postgres. Testing on SQLite hid migration drift and
    # Postgres-only behaviour, so CI now runs the real thing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bnb
          POSTGRES_PASSWORD: bnb
          POSTGRES_DB: motherboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bnb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://bnb:bnb@localhost:5432/motherboard_test
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID || 'mock_client_id' }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET || 'mock_client_secret' }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || 'mock_bot_token' }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID || 'mock_guild_id' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'mock_session_secret_32_bytes_long_secret_123' }}
      API_INTERNAL_SECRET: ${{ secrets.API_INTERNAL_SECRET || 'mock_internal_secret' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'mock_nextauth_secret' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --project apps/api --frozen

      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Check migrations match the models
        working-directory: apps/api
        # Fails when app/db/models.py has changes no migration accounts for.
        # Without this, deploy.sh used to paper over the gap with create_all
        # and the drift only surfaced as a 500 in production.
        run: uv run alembic check

      - name: Verify migrations are reversible
        working-directory: apps/api
        # deploy.sh rolls back to the previous revision when a deploy fails.
        # That only works if down-migrations actually run.
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run backend tests
        working-directory: apps/api
        run: uv run pytest

  deploy:
    name: Deploy to VPS
    needs: [lint, test]
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            echo "Starting deployment on VPS..."
            bash /opt/bnb-api/deploy/api/deploy.sh
