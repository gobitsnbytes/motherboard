[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests

# asyncio_mode = auto means every `async def test_*` is collected automatically,
# so no test needs an @pytest.mark.asyncio decorator.

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --durations=10
    --color=yes

filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
